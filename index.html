<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placar ao vivo · Tira-Time</title>
<meta name="description" content="Placar ao vivo do jogo no Tira-Time">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #051F38; --surface: #072B4D; --line: #17497A; --text: #F7FCFE; --muted: #C7DAE5;
    --orange: #F68414; --sky: #0388D7; --live: #FF6B6B; --yellow: #F5C518;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px; letter-spacing: .5px; }
  .brand b { color: var(--orange); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .meta { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 14px; }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .team { text-align: center; min-width: 0; }
  .crest { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 8px; display: grid; place-items: center;
           font-weight: 800; font-size: 18px; overflow: hidden; background-size: cover; background-position: center; }
  .tname { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 64px; line-height: 1;
           padding: 0 6px; white-space: nowrap; }
  .pens { color: var(--muted); font-size: 13px; text-align: center; margin-top: 4px; }
  .status { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; font-weight: 700; font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .clock { font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 26px; color: var(--orange); }
  h2 { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 22px 4px 10px; }
  .ev { display: grid; grid-template-columns: 1fr 44px 1fr; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ev:last-child { border-bottom: 0; }
  .ev .min { text-align: center; color: var(--muted); font-weight: 700; font-size: 13px; }
  .ev .home { text-align: right; } .ev .away { text-align: left; }
  .who { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; }
  .ev .home .who { flex-direction: row-reverse; }
  .ava { width: 30px; height: 30px; border-radius: 50%; flex: none; background: var(--line) center/cover no-repeat;
         display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--muted); }
  .tb { width: 18px; height: 18px; border-radius: 5px; flex: none; display: grid; place-items: center; font-size: 9px;
        font-weight: 800; background: center/cover no-repeat; }
  .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stoppage { color: var(--live); font-weight: 800; animation: pulse 1.2s infinite; }
  .ic { display: inline-block; width: 10px; height: 14px; border-radius: 2px; vertical-align: -2px; margin: 0 6px; }
  .empty, .error { text-align: center; color: var(--muted); padding: 30px 10px; }
  .foot { text-align: center; margin-top: 22px; color: var(--muted); font-size: 12px; }
  .entry h1 { font-size: 20px; margin: 0 0 6px; }
  .entry p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .entry input { width: 100%; font: 800 28px 'Barlow Condensed', sans-serif; font-style: italic; letter-spacing: 6px;
                 text-align: center; text-transform: uppercase; padding: 12px; border-radius: 12px;
                 border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .entry input:focus { outline: 2px solid var(--orange); }
  .btn { display: block; width: 100%; margin-top: 10px; padding: 13px; border-radius: 12px; border: 0; font: 800 15px 'Plus Jakarta Sans', sans-serif; cursor: pointer; }
  .btn.primary { background: var(--orange); color: var(--bg); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  #reader { margin-top: 12px; border-radius: 12px; overflow: hidden; }
  .switch { display: inline-block; margin-top: 8px; color: var(--muted); font-size: 13px; }
  a.app { display: inline-block; margin-top: 10px; background: var(--orange); color: var(--bg); font-weight: 800; text-decoration: none;
          padding: 12px 18px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <header><span class="brand">TIRA-<b>TIME</b></span><span style="color:var(--muted);font-size:13px">placar ao vivo</span></header>
  <div id="app"><div class="card empty">Carregando o placar…</div></div>
  <div class="foot">Atualiza sozinho a cada 10 segundos.<br><a class="app" id="open-app" href="#">Abrir no app Tira-Time</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  // Preenchido por tool/build_placar.py (URL do projeto e chave publica "publishable").
  const SUPABASE_URL = 'https://elhdfbqaqnwvadctigyh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_aIF6CfzjU2FVQ_ySFzQ_Lw_rIQKv5PV';
  const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z2-9]/g, '').slice(0, 8);
  document.getElementById('open-app').href = 'pelada://app/ao-vivo/' + code;
  if (!code) document.querySelector('.foot').style.display = 'none';

  // Codigo digitado ou lido no QR (aceita o codigo puro ou o link com ?c=).
  function codeFrom(text) {
    const t = String(text || '').trim();
    const m = t.match(/[?&]c=([A-Za-z2-9]{8})/) || t.match(/ao-vivo\/([A-Za-z2-9]{8})/);
    const raw = (m ? m[1] : t).toUpperCase().replace(/[^A-Z2-9]/g, '');
    return raw.length === 8 ? raw : null;
  }
  function openCode(c) { location.search = '?c=' + c; }

  let scanner = null;
  function renderEntry(msg) {
    document.getElementById('app').innerHTML = `
      <div class="card entry">
        <h1>Acompanhar um jogo</h1>
        <p>Digite o código do jogo (aparece no app, no painel da partida) ou leia o QR Code.</p>
        <form id="f"><input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABCD2345" aria-label="Código do jogo">
        <button class="btn primary" type="submit">Acompanhar ao vivo</button></form>
        <button class="btn ghost" id="scan" type="button">📷 Ler QR Code</button>
        <div id="reader"></div>
        ${msg ? `<p style="color:var(--live);margin-top:12px">${esc(msg)}</p>` : ''}
      </div>`;
    document.getElementById('f').onsubmit = (ev) => {
      ev.preventDefault();
      const c = codeFrom(document.getElementById('code').value);
      if (c) openCode(c); else renderEntry('O código tem 8 letras e números. Confira e tente de novo.');
    };
    document.getElementById('scan').onclick = startScan;
  }
  async function startScan() {
    if (typeof Html5Qrcode === 'undefined') { renderEntry('Leitor de QR indisponível. Digite o código.'); return; }
    try {
      scanner = new Html5Qrcode('reader');
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 230 }, async (text) => {
        const c = codeFrom(text);
        if (!c) return;
        try { await scanner.stop(); } catch (e) {}
        openCode(c);
      });
      document.getElementById('scan').textContent = 'Aponte a câmera para o QR Code';
    } catch (e) {
      renderEntry('Não foi possível abrir a câmera. Libere o acesso ou digite o código.');
    }
  }

  let data = null, offsetMs = 0;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeColor = (c) => /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#0561AF';
  const textOn = (hex) => { const n = parseInt(hex.slice(1), 16); const l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)); return l > 150 ? '#051F38' : '#F7FCFE'; };
  const safeUrl = (u) => /^https:\/\//.test(u || '') ? u : null;

  const PERIODS = { not_started: 'Não iniciado', first_half: '1º tempo', halftime: 'Intervalo', second_half: '2º tempo',
    extra_break: 'Intervalo', extra_first: '1º tempo da prorrogação', extra_halftime: 'Intervalo', extra_second: '2º tempo da prorrogação',
    penalties: 'Pênaltis', ended: 'Encerrado' };

  function peladaLabel() {
    if (data.clock_period === 'extra') return 'Prorrogação';
    if (data.clock_period === 'regular') return (data.halves || 1) > 1 ? `${data.clock_half || 1}º tempo` : 'Em jogo';
    return 'Ao vivo';
  }

  // Tempo do periodo atual: { text, stoppage }. Passou do tempo normal = acrescimos.
  function clockInfo() {
    if (!data) return { text: '', stoppage: false };
    let base, secs, paused = false;
    if (data.kind === 'pelada') {
      if (!['regular', 'extra'].includes(data.clock_period)) return { text: '', stoppage: false };
      const per = data.game_minutes || 10;
      base = data.clock_period === 'extra' ? per * (data.halves || 1) : per * ((data.clock_half || 1) - 1);
      paused = data.clock_paused_seconds != null;
      secs = paused ? data.clock_paused_seconds
        : (data.clock_started_at ? Math.max(0, (Date.now() + offsetMs - new Date(data.clock_started_at).getTime()) / 1000) : 0);
    } else {
      const running = { first_half: 0, second_half: 45, extra_first: 90, extra_second: 105 };
      if (!data.clock_started_at || !(data.clock_period in running)) return { text: '', stoppage: false };
      base = running[data.clock_period];
      secs = Math.max(0, (Date.now() + offsetMs - new Date(data.clock_started_at).getTime()) / 1000);
    }
    const len = (data.period_minutes || (data.kind === 'pelada' ? data.game_minutes : 45) || 45) * 60;
    const mmss = (v) => String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(Math.floor(v % 60)).padStart(2, '0');
    if (secs >= len) {
      // Tempo normal esgotado: mostra o fim do periodo + quanto ja rolou de acrescimo
      const extra = secs - len;
      const given = data.stoppage_minutes > 0 ? ` de +${data.stoppage_minutes}'` : '';
      return { text: mmss(base * 60 + len) + ' +' + mmss(extra) + given + (paused ? ' (pausado)' : ''), stoppage: true };
    }
    return { text: mmss(base * 60 + secs) + (paused ? ' (pausado)' : ''), stoppage: false };
  }
  function clockText() { return clockInfo().text; }
  function periodLabel() {
    const name = data.kind === 'pelada' ? peladaLabel() : (PERIODS[data.clock_period] || 'Ao vivo');
    return clockInfo().stoppage ? name + ' · ACRÉSCIMOS' : name;
  }

  function crest(t) {
    const color = safeColor(t && t.color);
    const url = safeUrl(t && t.crest_url);
    return url
      ? `<div class="crest" style="background-image:url('${esc(url)}');border:2px solid ${color}"></div>`
      : `<div class="crest" style="background:${color};color:${textOn(color)}">${esc(t ? t.short_code : '?')}</div>`;
  }

  function render() {
    const el = document.getElementById('app');
    if (!code) { renderEntry(); return; }
    if (!data) { renderEntry('Jogo não encontrado para o código ' + code + '. Confira e tente de novo.'); return; }
    const live = data.status === 'in_progress';
    const ended = data.status === 'finished';
    const when = data.scheduled_at ? new Date(data.scheduled_at).toLocaleString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
    const meta = [data.championship, data.round ? 'Rodada ' + data.round : null, when, data.venue].filter(Boolean).map(esc).join(' · ');
    const pens = data.home_pens != null && data.away_pens != null ? `<div class="pens">Pênaltis: ${data.home_pens} x ${data.away_pens}</div>` : '';
    const cancelled = data.status === 'cancelled';
    const status = live
      ? `<div class="status"><span class="dot"></span><span id="plabel" class="${clockInfo().stoppage ? 'stoppage' : ''}">${esc(periodLabel())}</span><span class="clock" id="clock">${clockText()}</span></div>`
      : `<div class="status" style="color:var(--muted)">${cancelled ? 'Partida cancelada' : ended ? 'Fim de jogo' : 'Ainda não começou'}</div>`;
    const many = Array.isArray(data.teams) && data.teams.length > 2;
    const icon = (t) => t === 'goal' ? '⚽' : t === 'own_goal' ? '⚽ (contra)' : t === 'yellow'
      ? '<span class="ic" style="background:var(--yellow)"></span>' : '<span class="ic" style="background:var(--live)"></span>';
    const teamName = (n) => (data.teams && data.teams[n - 1]) ? data.teams[n - 1].name : '';
    const initials = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const ava = (e) => {
      const u = safeUrl(e.avatar_url);
      return u ? `<span class="ava" style="background-image:url('${esc(u)}')"></span>` : `<span class="ava">${esc(initials(e.player))}</span>`;
    };
    const teamBadge = (e) => {
      if (data.kind === 'pelada') {
        const t = (data.teams || [])[(e.team || 1) - 1] || {};
        const c = safeColor(t.color);
        return `<span class="tb" style="background-color:${c};color:${textOn(c)}">${esc(t.short_code || '')}</span>`;
      }
      const u = safeUrl(e.team_crest), c = safeColor(e.team_color);
      return u ? `<span class="tb" style="background-image:url('${esc(u)}')"></span>`
               : `<span class="tb" style="background-color:${c};color:${textOn(c)}">${esc((e.team_short || '').slice(0, 3))}</span>`;
    };
    const who = (e) => `<span class="who">${ava(e)}<span class="pname">${icon(e.type)} ${esc(e.player || '')}</span>${teamBadge(e)}</span>`;
    const evs = (data.events || []).map((e) => {
      if (many) {
        return `<div class="ev" style="grid-template-columns:44px 1fr"><div class="min">${e.minute != null ? esc(e.minute) + "'" : ''}</div><div>${who(e)} <span style="color:var(--muted)">· ${esc(teamName(e.team))}</span></div></div>`;
      }
      const txt = who(e);
      return `<div class="ev"><div class="home">${e.side === 'home' ? txt : ''}</div><div class="min">${e.minute != null ? esc(e.minute) + "'" : ''}</div><div class="away">${e.side === 'away' ? txt : ''}</div></div>`;
    }).join('');
    el.innerHTML = `
      <div class="card">
        <div class="meta">${meta}</div>
        ${many ? data.teams.map((t) => `
          <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)">
            <div class="crest" style="width:40px;height:40px;margin:0;font-size:14px;background:${safeColor(t.color)};color:${textOn(safeColor(t.color))}">${esc(t.short_code)}</div>
            <div class="tname" style="flex:1">${esc(t.name)}</div>
            <div class="score" style="font-size:40px">${esc(t.score)}</div>
          </div>`).join('') : `
        <div class="teams">
          <div class="team">${crest(data.home)}<div class="tname">${esc(data.home ? data.home.name : 'A definir')}</div></div>
          <div class="score">${esc(data.home_score)} x ${esc(data.away_score)}</div>
          <div class="team">${crest(data.away)}<div class="tname">${esc(data.away ? data.away.name : 'A definir')}</div></div>
        </div>`}
        ${pens}${status}
      </div>
      <div style="text-align:center"><a class="switch" href="./">Acompanhar outro jogo</a></div>
      <h2>Gols e cartões</h2>
      <div class="card">${evs || '<div class="empty" style="padding:8px">Nenhum gol ou cartão ainda.</div>'}</div>`;
  }

  async function load() {
    if (!code) return render();
    try {
      const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/live_match', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_code: code }),
      });
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
      if (data && data.server_now) offsetMs = new Date(data.server_now).getTime() - Date.now();
      render();
    } catch (e) {
      if (!data) document.getElementById('app').innerHTML = '<div class="card error">Sem conexão. Tentando de novo…</div>';
    }
  }

  load();
  setInterval(() => { if (code) load(); }, 10000);
  setInterval(() => {
    const c = document.getElementById('clock'); if (c) c.textContent = clockText();
    const l = document.getElementById('plabel');
    if (l && data) { l.textContent = periodLabel(); l.className = clockInfo().stoppage ? 'stoppage' : ''; }
  }, 1000);
</script>
</body>
</html>
